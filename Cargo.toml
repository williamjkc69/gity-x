[package]
name = "gity-x"
version = "0.2.1"
edition = "2021"
authors = ["williamjkc69"]
license = "MIT"
repository = "https://github.com/williamjkc69/gity-x"
description = "Fast, lightweight cross-platform Git GUI in Rust inspired by GitKraken and VS Code Git Graph"

[dependencies]
eframe = "0.29"
rfd = "0.15"
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(target_os = "macos")'.dependencies]
muda = "0.15"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
