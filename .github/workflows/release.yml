name: Release Cross-Platform Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.2.1)'
        required: true
        default: 'v0.2.1'

permissions:
  contents: write

jobs:
  build-macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
            arch: arm64
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            arch: x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Resolve version
        id: ver
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "num=${TAG#v}" >> "$GITHUB_OUTPUT"
      - name: Build and package macOS DMG
        run: |
          chmod +x scripts/package-macos.sh
          ./scripts/package-macos.sh "${{ steps.ver.outputs.num }}" "${{ matrix.arch }}"
      - name: Optional Apple Developer Signing & Notarization
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$MACOS_CERT_P12" ] || [ -z "$MACOS_SIGN_IDENTITY" ]; then
            echo "Skipping Apple signing (secrets not configured)."
            exit 0
          fi
          KEYCHAIN="$RUNNER_TEMP/build.keychain-db"
          security create-keychain -p "temp" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "temp" "$KEYCHAIN"
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -P "$MACOS_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security list-keychain -d user -s "$KEYCHAIN"
          DMG=$(ls dist/*.dmg | head -n 1)
          codesign --force --options runtime --timestamp --sign "$MACOS_SIGN_IDENTITY" "$DMG"
          if [ -n "$APPLE_ID" ] && [ -n "$APPLE_APP_PASSWORD" ] && [ -n "$APPLE_TEAM_ID" ]; then
            xcrun notarytool submit "$DMG" --apple-id "$APPLE_ID" --password "$APPLE_APP_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
            xcrun stapler staple "$DMG"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: |
            dist/*.dmg
            dist/*.tar.gz

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Resolve version
        id: ver
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "num=${TAG#v}" >> "$GITHUB_OUTPUT"
      - name: Build Windows Release EXE
        run: cargo build --release
      - name: Package Windows EXE
        shell: bash
        run: |
          mkdir -p dist
          cp target/release/gity-x.exe "dist/gity-x-v${{ steps.ver.outputs.num }}-windows-x64.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: dist/*.exe

  build-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux GUI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libx11-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libssl-dev \
            pkg-config \
            libfuse2
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Resolve version
        id: ver
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "num=${TAG#v}" >> "$GITHUB_OUTPUT"
      - name: Build Linux Release Binary
        run: cargo build --release
      - name: Package Ubuntu .deb
        run: |
          VER="${{ steps.ver.outputs.num }}"
          mkdir -p dist deb-pkg/DEBIAN deb-pkg/usr/bin deb-pkg/usr/share/applications deb-pkg/usr/share/icons/hicolor/256x256/apps
          cp target/release/gity-x deb-pkg/usr/bin/gity-x
          chmod 755 deb-pkg/usr/bin/gity-x
          cp assets/icon.png deb-pkg/usr/share/icons/hicolor/256x256/apps/gity-x.png

          cat > deb-pkg/DEBIAN/control <<EOF
          Package: gity-x
          Version: ${VER}
          Section: devel
          Priority: optional
          Architecture: amd64
          Depends: git, libgtk-3-0t64 | libgtk-3-0
          Maintainer: williamjkc69 <https://github.com/williamjkc69/gity-x>
          Description: Fast, lightweight Git GUI in Rust inspired by GitKraken and VS Code Git Graph
          EOF

          cat > deb-pkg/usr/share/applications/gity-x.desktop <<EOF
          [Desktop Entry]
          Name=gity x
          Comment=Fast Git GUI in Rust
          Exec=/usr/bin/gity-x
          Icon=gity-x
          Terminal=false
          Type=Application
          Categories=Development;RevisionControl;
          EOF

          dpkg-deb --build deb-pkg "dist/gity-x-v${VER}-linux-amd64.deb"
      - name: Package Linux AppImage
        run: |
          VER="${{ steps.ver.outputs.num }}"
          mkdir -p AppDir/usr/bin AppDir/usr/share/icons/hicolor/256x256/apps
          cp target/release/gity-x AppDir/usr/bin/gity-x
          chmod 755 AppDir/usr/bin/gity-x
          cp assets/icon.png AppDir/gity-x.png
          cp assets/icon.png AppDir/.DirIcon
          cp assets/icon.png AppDir/usr/share/icons/hicolor/256x256/apps/gity-x.png

          cat > AppDir/gity-x.desktop <<EOF
          [Desktop Entry]
          Name=gity x
          Comment=Fast Git GUI in Rust
          Exec=gity-x
          Icon=gity-x
          Terminal=false
          Type=Application
          Categories=Development;
          EOF

          cat > AppDir/AppRun <<'EOF'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "${0}")")"
          exec "$HERE/usr/bin/gity-x" "$@"
          EOF
          chmod +x AppDir/AppRun

          curl -fsSL "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage" -o appimagetool
          chmod +x appimagetool
          ARCH=x86_64 ./appimagetool --appimage-extract-and-run AppDir "dist/gity-x-v${VER}-linux-x86_64.AppImage"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: |
            dist/*.deb
            dist/*.AppImage

  publish-release:
    needs: [build-macos, build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Resolve tag & release notes
        id: ver
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          python3 - "$TAG" <<'PY' > release-notes.md
          import os, re, sys
          tag = sys.argv[1]
          notes = ""
          if os.path.exists("CHANGELOG.md"):
              text = open("CHANGELOG.md", encoding="utf-8").read()
              m = re.search(rf"(?ms)^## \[{re.escape(tag)}\][^\n]*\n(.*?)(?=^## \[|\Z)", text)
              if m:
                  notes = m.group(1).strip()
          if notes:
              print(notes)
          PY
          cat release-notes.md
      - name: Generate SHA-256 Checksums
        run: |
          cd artifacts
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: gity x ${{ steps.ver.outputs.tag }}
          body_path: release-notes.md
          generate_release_notes: true
          files: artifacts/*
